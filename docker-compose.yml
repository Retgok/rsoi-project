version: "3"
services:
  postgres:
    image: library/postgres:15
    container_name: postgres
    restart: on-failure
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "postgres"
      POSTGRES_DB: postgres
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./postgres/:/docker-entrypoint-initdb.d/
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.2
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.3.2
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  identity_provider:
    container_name: identity_provider
    build:
      context: src
      dockerfile: IdentityProvider/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      DB_CONN_STR: Host=postgres;Port=5432;Database=identity;Username=program;Password=test
      Auth__Issuer: http://localhost:8090
      Auth__Audience: flight-booking
      Auth__UiLoginUrl: http://localhost:3000/login
      Auth__UiRedirectUrl: http://localhost:3000/callback
      Kafka__BootstrapServers: kafka:9092
    ports:
      - "8090:8090"

  statistics_service:
    container_name: statistics_service
    build:
      context: src
      dockerfile: StatisticsService/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      DB_CONN_STR: Host=postgres;Port=5432;Database=statistics;Username=program;Password=test
      Auth__Issuer: http://localhost:8090
      Auth__JwksUrl: http://identity_provider:8090/.well-known/jwks.json
      Kafka__BootstrapServers: kafka:9092
    ports:
      - "8040:8040"

  bonus_service:
    container_name: bonus_service
    build:
      context: src
      dockerfile: BonusService/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      identity_provider:
        condition: service_started
    environment:
      DB_CONN_STR: Host=postgres;Port=5432;Database=privileges;Username=program;Password=test
      Auth__Issuer: http://localhost:8090
      Auth__JwksUrl: http://identity_provider:8090/.well-known/jwks.json
      Kafka__BootstrapServers: kafka:9092
    ports:
      - "8050:8050"

  flight_service:
    container_name: flight_service
    build:
      context: src
      dockerfile: FlightService/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      identity_provider:
        condition: service_started
    environment:
      DB_CONN_STR: Host=postgres;Port=5432;Database=flights;Username=program;Password=test
      Auth__Issuer: http://localhost:8090
      Auth__JwksUrl: http://identity_provider:8090/.well-known/jwks.json
      Kafka__BootstrapServers: kafka:9092
    ports:
      - "8060:8060"

  ticket_service:
    container_name: ticket_service
    build:
      context: src
      dockerfile: TicketService/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      identity_provider:
        condition: service_started
    environment:
      DB_CONN_STR: Host=postgres;Port=5432;Database=tickets;Username=program;Password=test
      Auth__Issuer: http://localhost:8090
      Auth__JwksUrl: http://identity_provider:8090/.well-known/jwks.json
      Kafka__BootstrapServers: kafka:9092
    ports:
      - "8070:8070"

  gateway_service:
    container_name: gateway_service
    build:
      context: src
      dockerfile: ApiGateway/Dockerfile
    depends_on:
      bonus_service:
        condition: service_started
      flight_service:
        condition: service_started
      ticket_service:
        condition: service_started
      statistics_service:
        condition: service_started
      identity_provider:
        condition: service_started
      kafka:
        condition: service_started
    environment:
      Services__FlightService: http://flight_service:8060
      Services__BonusService: http://bonus_service:8050
      Services__TicketService: http://ticket_service:8070
      Services__StatisticsService: http://statistics_service:8040
      Services__IdentityProvider: http://identity_provider:8090
      Auth__PublicIdentityProviderUrl: http://localhost:8090
      Auth__Issuer: http://localhost:8090
      Auth__JwksUrl: http://identity_provider:8090/.well-known/jwks.json
      Auth__ClientId: flight-ui
      Auth__ClientSecret: flight-ui-secret
      Auth__CallbackUrl: http://localhost:8080/api/v1/callback
      Auth__UiRedirectUrl: http://localhost:3000/callback
      Kafka__BootstrapServers: kafka:9092
    ports:
      - "8080:8080"

  ui:
    container_name: flight_ui
    build:
      context: ui
    depends_on:
      - gateway_service
    ports:
      - "3000:80"

volumes:
  db-data:
